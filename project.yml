# Generates Pageside.xcodeproj. On a Mac: `brew install xcodegen`, then `xcodegen` in this folder.
name: Pageside
options:
  bundleIdPrefix: com.posi
  deploymentTarget:
    iOS: "17.0"
packages:
  RectoCore:
    path: RectoCore
targets:
  Pageside:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Pageside
    dependencies:
      - package: RectoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posi.pageside
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone (and Duo) and iPad only
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pageside
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Pageside:
    build:
      targets:
        Pageside: all
    test:
      targets: []
